<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mido — التقسيط والجمعيات</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mido">
  <meta name="theme-color" content="#14261E">
  <meta name="description" content="تطبيق إدارة التقسيط والجمعيات — يعمل بدون إنترنت">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #F2F5F2;
      --card: #FDFEFD;
      --border: #E2E8E3;
      --ink: #20302A;
      --muted: #6C7B73;
      --pine: #14261E;
      --pine-2: #1C352A;
      --mint: #A9C3B6;
      --primary: #2F7D5B;
      --primary-dark: #1E5A40;
      --primary-tint: #E4F1EA;
      --amber: #B07E33;
      --amber-tint: #F8EEDD;
      --danger: #B45858;
      --danger-tint: #F9E9E9;
      --blue: #4C7D9B;
      --blue-tint: #E8F1F6;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(20, 38, 30, .05), 0 6px 20px rgba(20, 38, 30, .05);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body {
      margin: 0;
      font-family: 'Tajawal', sans-serif;
      color: var(--ink);
      font-size: 15px;
      background:
        radial-gradient(900px 520px at 88% -10%, rgba(47, 125, 91, .08), transparent 60%),
        radial-gradient(760px 480px at -12% 105%, rgba(176, 126, 51, .07), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      user-select: none;
      -webkit-user-select: none;
    }

    h1,
    h2,
    h3,
    .kpi-value,
    .brand-text strong,
    .turn-badge {
      font-family: 'Cairo', 'Tajawal', sans-serif
    }

    .num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum"
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(.96) translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes slideDown {
      from {
        transform: translateY(-30px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    @keyframes toastUp {
      from {
        transform: translate(-50%, 20px);
        opacity: 0
      }

      to {
        transform: translate(-50%, 0);
        opacity: 1
      }
    }

    .login-wrapper {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(700px 400px at 80% 10%, rgba(47, 125, 91, .25), transparent 60%),
        radial-gradient(600px 400px at 10% 90%, rgba(176, 126, 51, .15), transparent 60%),
        var(--pine);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px
    }

    .login-wrapper[hidden] {
      display: none
    }

    .login-card {
      background: var(--card);
      border-radius: 16px;
      padding: 32px 26px;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
      text-align: center;
      animation: popIn .35s ease
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      background: linear-gradient(135deg, #37906A, #1E5A40);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 800 22px 'Cairo';
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(47, 125, 91, .35)
    }

    .login-card .brand-mark {
      margin: 0 auto 14px
    }

    .login-card h2 {
      margin: 0 0 6px;
      font-size: 19px;
      font-weight: 800
    }

    .login-card p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px
    }

    .login-card .form-group {
      text-align: right
    }

    .app {
      display: flex;
      min-height: 100vh
    }

    .sidebar {
      width: 252px;
      flex-shrink: 0;
      background: linear-gradient(180deg, var(--pine), var(--pine-2));
      color: var(--mint);
      display: flex;
      flex-direction: column;
      padding: 22px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 20;
      transition: transform .25s ease
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      margin-bottom: 14px
    }

    .brand .brand-mark {
      width: 38px;
      height: 38px;
      font-size: 18px
    }

    .brand-text strong {
      display: block;
      color: #fff;
      font-size: 15.5px
    }

    .brand-text small {
      color: var(--mint);
      font-size: 11px
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      overflow-y: auto
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      color: var(--mint);
      text-align: right;
      padding: 11px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 500;
      transition: background .15s, color .15s, box-shadow .15s;
      width: 100%
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .06);
      color: #fff
    }

    .nav-item.active {
      background: rgba(47, 125, 91, .35);
      color: #fff;
      font-weight: 700;
      box-shadow: inset -3px 0 0 #4CAF87
    }

    .nav-icon {
      font-size: 15px;
      width: 18px;
      text-align: center;
      opacity: .9
    }

    .nav-badge {
      margin-right: auto;
      background: var(--danger);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 10px
    }

    #change-password-nav {
      display: none;
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, .1);
      padding-top: 14px
    }

    #change-password-nav.show {
      display: flex
    }

    .sidebar-footer {
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .btn-new {
      width: 100%;
      background: linear-gradient(180deg, #37906A, #2A7355);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 9px;
      font-family: inherit;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      transition: .15s;
      box-shadow: 0 4px 12px rgba(47, 125, 91, .3)
    }

    .btn-new:hover {
      filter: brightness(1.06)
    }

    .btn-secondary-action {
      width: 100%;
      background: rgba(255, 255, 255, .07);
      color: var(--mint);
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 8px;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: .15s;
      text-align: center
    }

    .btn-secondary-action:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, .3)
    }

    .btn-logout {
      color: #E8A0A0;
      border-color: rgba(180, 88, 88, .35)
    }

    .btn-logout:hover {
      color: #FF8F8F
    }

    .content {
      flex: 1;
      padding: 26px 34px 70px;
      max-width: 1200px;
      width: 100%
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .mobile-menu-btn {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 18px;
      cursor: pointer;
      color: var(--ink)
    }

    .topbar h1 {
      font-size: 23px;
      margin: 0;
      font-weight: 800
    }

    .topbar-date {
      color: var(--muted);
      font-size: 13px
    }

    .view {
      display: block;
      animation: fadeUp .28s ease
    }

    .view[hidden] {
      display: none
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px
    }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      transition: transform .18s, box-shadow .18s
    }

    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(20, 38, 30, .06), 0 12px 28px rgba(20, 38, 30, .08)
    }

    .kpi-label {
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 8px
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.1
    }

    .kpi-value.amber {
      color: var(--amber)
    }

    .kpi-value.danger {
      color: var(--danger)
    }

    .kpi-value.primary {
      color: var(--primary)
    }

    .kpi-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      overflow: hidden
    }

    .panel-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px
    }

    .panel-header h2 {
      font-size: 15.5px;
      margin: 0;
      font-weight: 800
    }

    .panel-body {
      padding: 6px 0
    }

    .row-list {
      display: flex;
      flex-direction: column
    }

    .row-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
      transition: background .12s;
      animation: fadeUp .3s both
    }

    .row-item:last-child {
      border-bottom: none
    }

    .row-item:hover {
      background: #F7FAF7
    }

    .row-main {
      flex: 1;
      min-width: 0
    }

    .row-title {
      font-weight: 700;
      font-size: 14px
    }

    .row-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 3px
    }

    .row-amount {
      font-weight: 800;
      font-size: 14.5px;
      white-space: nowrap
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 11px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap
    }

    .pill-ok {
      background: var(--primary-tint);
      color: var(--primary-dark)
    }

    .pill-warn {
      background: var(--amber-tint);
      color: var(--amber)
    }

    .pill-danger {
      background: var(--danger-tint);
      color: var(--danger)
    }

    .pill-muted {
      background: #EEF1EE;
      color: var(--muted)
    }

    .pill-partial {
      background: #FFF3E0;
      color: #B06A10
    }

    .pill-soon {
      background: var(--blue-tint);
      color: var(--blue)
    }

    .inst-track {
      display: flex;
      gap: 3px;
      align-items: center
    }

    .inst-seg {
      height: 8px;
      flex: 1;
      border-radius: 3px;
      background: #E4E9E4;
      transition: background .3s
    }

    .inst-seg.paid {
      background: var(--primary)
    }

    .inst-seg.overdue {
      background: var(--danger)
    }

    .inst-seg.partial {
      background: var(--amber)
    }

    .btn {
      font-family: inherit;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px
    }

    .btn-primary {
      background: linear-gradient(180deg, #37906A, #2A7355);
      color: #fff;
      box-shadow: 0 2px 8px rgba(47, 125, 91, .25)
    }

    .btn-primary:hover {
      filter: brightness(1.06)
    }

    .btn-primary:active {
      transform: scale(.97)
    }

    .btn-outline {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--border)
    }

    .btn-outline:hover {
      background: #F3F6F3
    }

    .btn-danger-text {
      background: transparent;
      color: var(--danger)
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .search-input {
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13.5px;
      width: 240px;
      background: #fff
    }

    .search-input:focus {
      outline: 2px solid var(--primary);
      outline-offset: -1px
    }

    .summary-box {
      background: #F7FAF7;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
      color: var(--muted)
    }

    .summary-row.highlight {
      font-weight: 800;
      color: var(--primary-dark);
      border-top: 1px dashed var(--border);
      margin-top: 4px;
      padding-top: 8px;
      font-size: 14px
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted)
    }

    .empty-state .empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
      opacity: .6
    }

    .empty-state p {
      margin: 4px 0;
      font-size: 13.5px
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 38, 30, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px)
    }

    .modal-backdrop[hidden] {
      display: none
    }

    .modal {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
      animation: popIn .25s ease
    }

    .modal h2 {
      margin: 0 0 16px;
      font-size: 17px;
      font-weight: 800
    }

    .modal-close-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap
    }

    .form-group {
      margin-bottom: 14px
    }

    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      background: #fff;
      color: var(--ink)
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: 2px solid var(--primary);
      outline-offset: -1px
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .form-hint {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 4px
    }

    .form-error {
      background: var(--danger-tint);
      color: var(--danger);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-bottom: 14px
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--pine);
      color: #fff;
      padding: 11px 22px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
      max-width: 90%;
      text-align: center;
      animation: toastUp .25s ease
    }

    .toast[hidden] {
      display: none
    }

    .inapp-notification {
      position: fixed;
      top: 70px;
      right: 20px;
      left: 20px;
      max-width: 420px;
      margin: 0 auto;
      padding: 14px 18px;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .25);
      z-index: 300;
      font-size: 14px;
      animation: slideDown .3s ease;
      color: #fff
    }

    .inapp-notification.info {
      background: var(--primary)
    }

    .inapp-notification.warning {
      background: var(--amber)
    }

    .inapp-notification.danger {
      background: var(--danger)
    }

    .inapp-notification.success {
      background: var(--primary-dark)
    }

    .profile-head {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .profile-avatar {
      width: 54px;
      height: 54px;
      border-radius: 15px;
      background: linear-gradient(135deg, #37906A, #1E5A40);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 800 24px 'Cairo';
      box-shadow: 0 6px 16px rgba(47, 125, 91, .3)
    }

    .profile-head-info {
      flex: 1;
      min-width: 180px
    }

    .profile-head-info h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 800
    }

    .profile-head-info .sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr
    }

    .detail-item {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border)
    }

    .detail-item:nth-child(odd) {
      border-inline-end: 1px solid var(--border)
    }

    .detail-item.wide {
      grid-column: 1/-1
    }

    .detail-item:last-child,
    .detail-item.wide:last-child {
      border-bottom: none
    }

    .detail-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      display: block;
      margin-bottom: 5px
    }

    .detail-value {
      font-size: 14.5px;
      font-weight: 600;
      word-break: break-word;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .detail-value a {
      color: var(--primary-dark);
      text-decoration: none
    }

    .ends-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 16px 20px
    }

    .inst-end-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      background: #FBFCFB;
      position: relative;
      overflow: hidden;
      transition: transform .18s, box-shadow .18s
    }

    .inst-end-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow)
    }

    .inst-end-card::before {
      content: '';
      position: absolute;
      inset-inline-start: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--muted)
    }

    .inst-end-card.ok::before {
      background: var(--primary)
    }

    .inst-end-card.partial::before {
      background: var(--amber)
    }

    .inst-end-card.danger::before {
      background: var(--danger)
    }

    .inst-end-card.soon::before {
      background: var(--blue)
    }

    .inst-end-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px
    }

    .inst-end-label {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--muted)
    }

    .inst-end-product {
      font-family: 'Cairo';
      font-weight: 800;
      font-size: 15px
    }

    .inst-end-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
      margin-top: 12px
    }

    .inst-end-grid span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600
    }

    .inst-end-grid b {
      font-size: 13.5px
    }

    .ends-empty {
      grid-column: 1/-1;
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-size: 13.5px
    }

    .turn-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--pine);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0
    }

    .round-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px
    }

    .round-table th,
    .round-table td {
      padding: 8px 10px;
      text-align: center;
      border-bottom: 1px solid var(--border)
    }

    .round-table th {
      color: var(--muted);
      font-weight: 700;
      background: #F7FAF7
    }

    .round-table td.member-name {
      text-align: right;
      font-weight: 600;
      min-width: 110px
    }

    .pay-dot {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      background: #EEF1EE;
      color: var(--muted);
      transition: .15s
    }

    .pay-dot:hover {
      transform: scale(1.12)
    }

    .pay-dot.paid {
      background: var(--primary);
      color: #fff
    }

    .pay-dot.overdue-cell {
      background: var(--danger-tint);
      color: var(--danger);
      border: 1px solid var(--danger)
    }

    .payout-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border)
    }

    .payout-row:last-child {
      border-bottom: none
    }

    .overlay-drawer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .4);
      z-index: 15
    }

    .overlay-drawer.open {
      display: block
    }

    .install-banner {
      display: none;
      background: linear-gradient(180deg, #37906A, #2A7355);
      color: #fff;
      padding: 12px 16px;
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      border: none;
      font-family: inherit;
      font-size: 14px;
      box-shadow: 0 -4px 12px rgba(0, 0, 0, .2)
    }

    .install-banner.show {
      display: block
    }

    @media (max-width:820px) {
      .app {
        flex-direction: column
      }

      .sidebar {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        transform: translateX(100%);
        box-shadow: -5px 0 25px rgba(0, 0, 0, .3)
      }

      .sidebar.open {
        transform: translateX(0)
      }

      .mobile-menu-btn {
        display: inline-flex
      }

      .content {
        padding: 16px 16px 50px
      }

      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px
      }

      .search-input {
        width: 100%
      }

      .form-row,
      .details-grid,
      .ends-grid {
        grid-template-columns: 1fr
      }

      .detail-item:nth-child(odd) {
        border-inline-end: none
      }

      .row-item {
        flex-wrap: wrap;
        gap: 8px
      }

      .row-amount {
        margin-right: auto
      }

      .modal {
        padding: 16px
      }

      .inapp-notification {
        top: 60px;
        right: 10px;
        left: 10px;
        font-size: 13px;
        padding: 12px 14px
      }
    }

    @media (max-width:480px) {
      .kpi-card {
        padding: 12px
      }

      .kpi-value {
        font-size: 19px
      }

      .row-item {
        padding: 10px 12px
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper" id="activation-screen" hidden>
    <div class="login-card">

      <div id="activation-error"></div>
      <div class="form-group">

      <div class="form-group">

          style="font-family:monospace;text-align:center;letter-spacing:1px;">
      </div>

  <div class="login-wrapper" id="login-screen" hidden>
    <div class="login-card">

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script>
    // ================= PWA =================
    function makeIcon(size) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, size, size);
      g.addColorStop(0, '#37906A'); g.addColorStop(1, '#14261E');
      x.fillStyle = g;
      if (x.roundRect) { x.beginPath(); x.roundRect(0, 0, size, size, size * 0.22); x.fill(); }
      else x.fillRect(0, 0, size, size);
      x.fillStyle = '#fff'; x.font = '800 ' + (size * 0.52) + 'px Cairo, sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText('M', size / 2, size / 2 + size * 0.03);
      return c.toDataURL('image/png');
    }
    (function setupPWA() {
      const icon512 = makeIcon(512), icon192 = makeIcon(192);
      const manifest = {
        name: 'Mido — التقسيط والجمعيات', short_name: 'Mido', start_url: '.', scope: '.',
        display: 'standalone', orientation: 'portrait', dir: 'rtl', lang: 'ar',
        background_color: '#F2F5F2', theme_color: '#14261E',
        icons: [{ src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
      };
      const link = document.createElement('link'); link.rel = 'manifest';
      link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
      document.head.appendChild(link);
      const ap = document.createElement('link'); ap.rel = 'apple-touch-icon'; ap.href = icon192; document.head.appendChild(ap);
    })();
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; installBanner.textContent = '📱 ثبّت التطبيق على هاتفك'; installBanner.classList.add('show'); });
    if (isIOS && !isStandalone) { installBanner.textContent = '📱 للتثبيت على الآيفون: زر المشاركة ⬆ ثم "إضافة إلى الشاشة الرئيسية"'; installBanner.classList.add('show'); }
    installBanner.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt(); const r = await deferredPrompt.userChoice;
        showToast(r.outcome === 'accepted' ? '✅ تم تثبيت التطبيق' : '❌ تم إلغاء التثبيت');
        deferredPrompt = null; installBanner.classList.remove('show');
      }
      else if (isIOS) { showToast('اضغط زر المشاركة ⬆ ثم "إضافة إلى الشاشة الرئيسية"'); }
    });
    window.addEventListener('appinstalled', () => { installBanner.classList.remove('show'); showToast('🎉 شكراً لتثبيت التطبيق!'); });

    // ================= التفعيل =================
    const MIDO_ACTIVATION_SECRET = "Mido-Kareem-2026-Xyq7-SecretKey";
    function getOrCreateDeviceCode() {
      let code = localStorage.getItem('mido_device_code');
      if (!code) {
        const b = new Uint8Array(6); crypto.getRandomValues(b);
        code = Array.from(b).map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase().match(/.{1,4}/g).join('-');
        localStorage.setItem('mido_device_code', code);
      }
      return code;
    }
    async function computeExpectedActivationCode(deviceCode) {
      const data = new TextEncoder().encode(deviceCode + MIDO_ACTIVATION_SECRET);
      const h = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase().slice(0, 8).match(/.{1,4}/g).join('-');
    }
    const normalizeCode = c => (c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    const isActivated = () => localStorage.getItem('mido_activated') === '1';
    async function initActivationScreen() {
      const deviceCode = getOrCreateDeviceCode();
      document.getElementById('device-code-display').value = deviceCode;
      document.getElementById('copy-device-code-btn').addEventListener('click', () => {
        navigator.clipboard.writeText(deviceCode).then(() => showToast('تم نسخ كود الجهاز'))
          .catch(() => { document.getElementById('device-code-display').select(); showToast('حدد الكود وانسخه يدويًا'); });
      });
      async function submit() {
        const errBox = document.getElementById('activation-error'); errBox.innerHTML = '';
        const entered = normalizeCode(document.getElementById('activation-code-input').value);
        const expected = normalizeCode(await computeExpectedActivationCode(deviceCode));
        if (entered && entered === expected) {
          localStorage.setItem('mido_activated', '1'); showToast('تم تفعيل التطبيق بنجاح');
          document.getElementById('activation-screen').hidden = true; checkAuth();
        } else errBox.innerHTML = '<div class="form-error">❌ كود التفعيل غير صحيح</div>';
      }
      document.getElementById('activate-btn').addEventListener('click', submit);
      document.getElementById('activation-code-input').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    }
    function checkActivation() {
      if (isActivated()) { document.getElementById('activation-screen').hidden = true; checkAuth(); }
      else {
        document.getElementById('login-screen').hidden = true; document.getElementById('app-container').style.display = 'none';
        document.getElementById('activation-screen').hidden = false; initActivationScreen();
      }
    }

    // ================= الدخول =================
    let ADMIN_USER = localStorage.getItem('mido_admin_username') || "admin";
    let ADMIN_PASS = localStorage.getItem('mido_admin_password') || "admin123";
    function checkAuth() {
      const loginScreen = document.getElementById('login-screen'), appContainer = document.getElementById('app-container'),
        changePassBtn = document.getElementById('change-password-nav');
      if (sessionStorage.getItem('mido_admin_logged') === 'true') {
        loginScreen.hidden = true; appContainer.style.display = 'flex'; changePassBtn.classList.add('show');
        setTimeout(sendWhatsAppNotifications, 3000); setTimeout(checkDueInstallments, 5000);
      } else { loginScreen.hidden = false; appContainer.style.display = 'none'; changePassBtn.classList.remove('show'); }
    }
    document.getElementById('login-btn').addEventListener('click', () => {
      const user = document.getElementById('login-username').value.trim(), pass = document.getElementById('login-password').value.trim(),
        errBox = document.getElementById('login-error');
      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem('mido_admin_logged', 'true'); checkAuth();
        document.getElementById('login-username').value = ''; document.getElementById('login-password').value = '';
        errBox.innerHTML = ''; showToast('تم تسجيل الدخول بنجاح'); loadDashboard();
      } else errBox.innerHTML = '<div class="form-error">❌ اسم المستخدم أو كلمة المرور غير صحيحة</div>';
    });
    ['login-password', 'login-username'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-btn').click(); }));
    document.getElementById('logout-btn').addEventListener('click', () => {
      if (confirm('هل أنت متأكد من تسجيل الخروج؟')) { sessionStorage.removeItem('mido_admin_logged'); checkAuth(); showToast('تم تسجيل الخروج'); }
    });

    document.getElementById('change-password-nav').addEventListener('click', () => { openChangeCredentialsModal(); closeDrawer(); });
    function openChangeCredentialsModal() {
      openModal(`
  <h2>🔑 تغيير بيانات الدخول</h2><div id="change-cred-error"></div>
  <div class="form-group"><label>اسم المستخدم الحالي</label><input type="text" value="${esc(ADMIN_USER)}" readonly dir="ltr" style="background:#F3F6F3;"></div>
  <div class="form-group"><label>اسم المستخدم الجديد</label><input type="text" id="new-username" dir="ltr"><div class="form-hint">اتركه فارغاً إذا لم تريد التغيير</div></div>
  <hr style="border-color:var(--border);margin:16px 0;">
  <div class="form-group"><label>كلمة السر الحالية *</label><input type="password" id="old-password" dir="ltr"></div>
  <div class="form-group"><label>كلمة السر الجديدة</label><input type="password" id="new-password" dir="ltr"><div class="form-hint">اتركها فارغة إذا لم تريد التغيير (4 أحرف على الأقل)</div></div>
  <div class="form-group"><label>تأكيد كلمة السر الجديدة</label><input type="password" id="confirm-password" dir="ltr"></div>
  <div class="modal-close-row"><button class="btn btn-outline" onclick="closeModal()">إلغاء</button><button class="btn btn-primary" id="save-credentials-btn">حفظ التغيير</button></div>`);
      document.getElementById('save-credentials-btn').addEventListener('click', () => {
        const oldPass = document.getElementById('old-password').value.trim(),
          newUsername = document.getElementById('new-username').value.trim(),
          newPass = document.getElementById('new-password').value.trim(),
          confirmPass = document.getElementById('confirm-password').value.trim(),
          errBox = document.getElementById('change-cred-error');
        if (oldPass !== ADMIN_PASS) { errBox.innerHTML = '<div class="form-error">❌ كلمة السر الحالية غير صحيحة</div>'; return; }
        let changes = [];
        if (newUsername && newUsername !== ADMIN_USER) { ADMIN_USER = newUsername; localStorage.setItem('mido_admin_username', newUsername); changes.push('اسم المستخدم'); }
        if (newPass) {
          if (newPass.length < 4) { errBox.innerHTML = '<div class="form-error">❌ كلمة السر قصيرة جداً (4 أحرف على الأقل)</div>'; return; }
          if (newPass !== confirmPass) { errBox.innerHTML = '<div class="form-error">❌ كلمة السر غير مطابقة للتأكيد</div>'; return; }
          if (newPass === oldPass) { errBox.innerHTML = '<div class="form-error">❌ كلمة السر الجديدة يجب أن تختلف عن القديمة</div>'; return; }
          ADMIN_PASS = newPass; localStorage.setItem('mido_admin_password', newPass); changes.push('كلمة السر');
        }
        if (!changes.length) { errBox.innerHTML = '<div class="form-error">❌ لم تقم بتغيير أي شيء</div>'; return; }
        closeModal(); showToast('✅ تم تغيير ' + changes.join(' و ') + ' بنجاح');
        sessionStorage.removeItem('mido_admin_logged'); checkAuth();
      });
    }

    function showInAppNotification(message, type = 'info', duration = 8000) {
      const colors = { info: 'var(--primary)', warning: 'var(--amber)', danger: 'var(--danger)', success: 'var(--primary-dark)' };
      const icons = { info: '📢', warning: '⚠️', danger: '🚨', success: '✅' };
      const titles = { info: 'إشعار', warning: 'تنبيه', danger: 'مهم', success: 'تم بنجاح' };
      const n = document.createElement('div'); n.className = 'inapp-notification ' + type; n.style.background = colors[type];
      n.innerHTML = '<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:20px;">' + icons[type] + '</span>' +
        '<div style="flex:1;"><div style="font-weight:700;margin-bottom:4px;">' + titles[type] + '</div>' +
        '<div style="font-weight:400;font-size:13px;opacity:.95;white-space:pre-line;">' + esc(message) + '</div></div>' +
        '<button onclick="this.parentElement.parentElement.remove()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">✕</button></div>';
      document.body.appendChild(n);
      setTimeout(() => { if (n.parentElement) { n.style.opacity = '0'; n.style.transition = 'opacity .3s'; setTimeout(() => n.remove(), 300); } }, duration);
    }

    async function checkDueInstallments() {
      try {
        const installments = await db.getAll('installments'), plans = await db.getAll('plans'), customers = await db.getAll('customers');
        const today = todayStr();
        const two = new Date(); two.setDate(two.getDate() + 2); const twoStr = toLocalISO(two);
        const dueSoon = installments.filter(i => !i.paid && i.due_date >= today && i.due_date <= twoStr);
        const overdue = installments.filter(i => !i.paid && i.due_date < today);
        const partial = installments.filter(i => !i.paid && (i.remaining_balance || 0) > 0);
        for (const inst of dueSoon) {
          const plan = plans.find(p => p.id === inst.plan_id), cust = customers.find(c => c.id === (plan ? plan.customer_id : null));
          if (!cust) continue;
          showInAppNotification('📌 ' + cust.name + '\nقسط ' + (plan ? plan.product_name : '') + '\nالمبلغ: ' + fmt(inst.amount) + ' ج.م\nيستحق: ' + inst.due_date, 'warning', 10000);
        }
        if (overdue.length > 0) showInAppNotification('🚨 يوجد ' + overdue.length + ' أقساط متأخرة!\nإجمالي المتأخر: ' + fmt(overdue.reduce((s, i) => s + i.amount - (i.paid_amount || 0), 0)) + ' ج.م\nراجع صفحة المتأخرات', 'danger', 12000);
        if (partial.length > 0) {
          let msg = '📊 رصيد معلق:\n';
          partial.slice(0, 3).forEach(i => {
            const plan = plans.find(p => p.id === i.plan_id); const cust = customers.find(c => c.id === (plan ? plan.customer_id : null));
            if (cust) msg += '• ' + cust.name + ': متبقي ' + fmt(i.remaining_balance) + ' ج.م\n';
          });
          if (partial.length > 3) msg += 'و ' + (partial.length - 3) + ' أخرى...';
          showInAppNotification(msg, 'info', 10000);
        }
        updateOverdueBadge(overdue.length);
      } catch (err) { console.log('⚠️ خطأ في فحص الأقساط:', err); }
    }
    setInterval(checkDueInstallments, 6 * 60 * 60 * 1000);

    // ====================================================================
    // ★★★ محرك التخزين الذكي — IndexedDB مع fallback لـ localStorage ★★★
    // بيحاول IndexedDB الأول، ولو المتصفح رفضه (فتح ملف محلي / وضع متخفي /
    // قيود خصوصية) بيقع تلقائياً على تخزين بديل بنفس الـ API بالظبط.
    // النتيجة: التطبيق مش هيفشل في فتح قاعدة البيانات تاني أبداً.
    // ====================================================================
    class LocalDB {
      constructor() { this.dbName = 'MidoOfflineAppDB'; this.version = 3; this.db = null; this.useLocalStorage = false; }
      _stores() { return ['customers', 'plans', 'installments', 'circles', 'circle_members', 'circle_payments', 'circle_payouts', 'collection_months']; }
      _k(s) { return 'mido_ls_' + s; }
      _sk(s) { return 'mido_ls_seq_' + s; }
      _lsAll(s) { try { return JSON.parse(localStorage.getItem(this._k(s)) || '[]'); } catch (e) { return []; } }
      _lsSave(s, a) { try { localStorage.setItem(this._k(s), JSON.stringify(a)); return true; } catch (e) { console.warn('⚠️ localStorage ممتلئ/مقيد', e); return false; } }
      _lsId(s) { const n = parseInt(localStorage.getItem(this._sk(s)) || '0', 10) + 1; localStorage.setItem(this._sk(s), String(n)); return n; }
      _fallback(reason) {
        if (this.useLocalStorage) return;
        this.useLocalStorage = true; this.db = null;
        console.warn('⚠️ IndexedDB غير متاح (' + (reason && reason.message || reason || 'غير معروف') + ') — تم تفعيل التخزين البديل عبر localStorage.');
        if (sessionStorage.getItem('mido_ls_notice') !== '1') {
          sessionStorage.setItem('mido_ls_notice', '1');
          setTimeout(() => showToast('⚠️ وضع التخزين البديل مفعّل — التطبيق شغال عادي'), 700);
        }
      }
      open() {
        if (this.useLocalStorage) return Promise.resolve('ls');
        if (this.db) return Promise.resolve(this.db);
        if (!window.indexedDB) { this._fallback('المتصفح لا يدعم IndexedDB'); return Promise.resolve('ls'); }
        return new Promise((resolve) => {
          let req;
          try { req = indexedDB.open(this.dbName, this.version); }
          catch (e) { this._fallback(e); return resolve('ls'); }
          req.onerror = () => { this._fallback(req.error); resolve('ls'); };
          req.onblocked = () => { this._fallback('قاعدة البيانات محجوبة'); resolve('ls'); };
          req.onsuccess = () => { if (this.useLocalStorage) return resolve('ls'); this.db = req.result; resolve(this.db); };
          req.onupgradeneeded = e => {
            try {
              const d = e.target.result;
              this._stores().forEach(s => { if (d.objectStoreNames.contains(s)) d.deleteObjectStore(s); });
              const c = d.createObjectStore('customers', { keyPath: 'id', autoIncrement: true }); c.createIndex('name', 'name', { unique: false });
              const p = d.createObjectStore('plans', { keyPath: 'id', autoIncrement: true }); p.createIndex('customer_id', 'customer_id', { unique: false });
              const i = d.createObjectStore('installments', { keyPath: 'id', autoIncrement: true }); i.createIndex('plan_id', 'plan_id', { unique: false }); i.createIndex('due_date', 'due_date', { unique: false });
              d.createObjectStore('circles', { keyPath: 'id', autoIncrement: true });
              const cm = d.createObjectStore('circle_members', { keyPath: 'id', autoIncrement: true }); cm.createIndex('circle_id', 'circle_id', { unique: false });
              const cp = d.createObjectStore('circle_payments', { keyPath: 'id', autoIncrement: true }); cp.createIndex('circle_id', 'circle_id', { unique: false });
              const cpo = d.createObjectStore('circle_payouts', { keyPath: 'id', autoIncrement: true }); cpo.createIndex('circle_id', 'circle_id', { unique: false });
              const col = d.createObjectStore('collection_months', { keyPath: 'id', autoIncrement: true }); col.createIndex('month', 'month', { unique: false }); col.createIndex('customer_id', 'customer_id', { unique: false }); col.createIndex('installment_id', 'installment_id', { unique: false });
            } catch (err) { this._fallback(err); }
          };
        });
      }
      async getAll(s) { const d = await this.open(); if (this.useLocalStorage) return this._lsAll(s); return new Promise(res => { const r = d.transaction(s, 'readonly').objectStore(s).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => { this._fallback(r.error); res(this._lsAll(s)); }; }); }
      async getById(s, id) { const d = await this.open(); if (this.useLocalStorage) return this._lsAll(s).find(x => x.id == id); return new Promise(res => { const r = d.transaction(s, 'readonly').objectStore(s).get(Number(id)); r.onsuccess = () => res(r.result); r.onerror = () => { this._fallback(r.error); res(this._lsAll(s).find(x => x.id == id)); }; }); }
      async add(s, data) { const d = await this.open(); if (this.useLocalStorage) { const a = this._lsAll(s); const id = this._lsId(s); const obj = Object.assign({}, data, { id }); a.push(obj); this._lsSave(s, a); return id; } return new Promise(res => { const r = d.transaction(s, 'readwrite').objectStore(s).add(data); r.onsuccess = () => res(r.result); r.onerror = () => { this._fallback(r.error); const a = this._lsAll(s); const id = this._lsId(s); const obj = Object.assign({}, data, { id }); a.push(obj); this._lsSave(s, a); res(id); }; }); }
      async update(s, data) { const d = await this.open(); if (this.useLocalStorage) { const a = this._lsAll(s); const i = a.findIndex(x => x.id == data.id); if (i >= 0) a[i] = data; else a.push(data); this._lsSave(s, a); return data.id; } return new Promise(res => { const r = d.transaction(s, 'readwrite').objectStore(s).put(data); r.onsuccess = () => res(r.result); r.onerror = () => { this._fallback(r.error); const a = this._lsAll(s); const i = a.findIndex(x => x.id == data.id); if (i >= 0) a[i] = data; else a.push(data); this._lsSave(s, a); res(data.id); }; }); }
      async delete(s, id) { const d = await this.open(); if (this.useLocalStorage) { this._lsSave(s, this._lsAll(s).filter(x => x.id != id)); return; } return new Promise(res => { const r = d.transaction(s, 'readwrite').objectStore(s).delete(Number(id)); r.onsuccess = () => res(); r.onerror = () => { this._fallback(r.error); this._lsSave(s, this._lsAll(s).filter(x => x.id != id)); res(); }; }); }
      async clearAll() { const d = await this.open(); const stores = this._stores(); if (this.useLocalStorage) { stores.forEach(s => this._lsSave(s, [])); return; } const tx = d.transaction(stores, 'readwrite'); stores.forEach(s => tx.objectStore(s).clear()); return new Promise(res => { tx.oncomplete = () => res(); tx.onerror = () => { this._fallback(tx.error); stores.forEach(s => this._lsSave(s, [])); res(); }; }); }
    }
    const db = new LocalDB();

    // ================= أدوات مساعدة =================
    const state = { view: 'dashboard', customers: [], plans: [], currentCustomerId: null };
    function fmt(n) { return Number(n || 0).toLocaleString('ar-EG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function toLocalISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    function todayStr() { return toLocalISO(new Date()); }
    function round2(n) { return Math.round(n * 100) / 100; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
    function showToast(msg) {
      const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
      clearTimeout(showToast._timer); showToast._timer = setTimeout(() => t.hidden = true, 2600);
    }
    function closeModal() { document.getElementById('modal-backdrop').hidden = true; document.getElementById('modal').innerHTML = ''; }
    function openModal(html) { document.getElementById('modal').innerHTML = html; document.getElementById('modal-backdrop').hidden = false; }
    document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') closeModal(); });
    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
    function emptyRow(msg) { return '<div class="empty-state"><div class="empty-icon">◎</div><p>' + msg + '</p></div>'; }

    }

    }

    // ================= التنقل =================

      try {

    // ================= الرئيسية =================
    async function loadDashboard() {
      const el = document.getElementById('view-dashboard');
      el.innerHTML = '<p style="color:var(--muted)">جاري التحميل...</p>';
      try {
        const customers = await db.getAll('customers'), plans = await db.getAll('plans'),
          installments = await db.getAll('installments'), collectionMonths = await db.getAll('collection_months');
        const today = todayStr();
        const seven = new Date(); seven.setDate(seven.getDate() + 7); const sevenStr = toLocalISO(seven);
        let totalOutstanding = 0, overdueCount = 0, overdueAmount = 0, dueSoonCount = 0, dueSoonAmount = 0,
          collectedThisMonth = 0, totalCollected = 0, partialPayments = 0;
        const currentMonth = today.substring(0, 7), upcoming = [];
        collectionMonths.forEach(col => { if (col.month === currentMonth) collectedThisMonth += col.amount; });
        installments.forEach(inst => {
          const plan = plans.find(p => p.id === inst.plan_id), cust = customers.find(c => c && c.id === (plan ? plan.customer_id : null));
          const custName = cust ? cust.name : 'عميل غير معروف', custPhone = cust ? cust.phone : '', prodName = plan ? plan.product_name : '';
          if (inst.paid) { totalCollected += inst.paid_amount || inst.amount; }
          else {
            const remaining = inst.amount - (inst.paid_amount || 0);
            totalOutstanding += remaining;
            if ((inst.paid_amount || 0) > 0) partialPayments++;
            if (inst.due_date < today) {
              overdueCount++; overdueAmount += remaining;
              upcoming.push({ ...inst, customer_name: custName, product_name: prodName, phone: custPhone, remaining });
            }
            else if (inst.due_date <= sevenStr) {
              dueSoonCount++; dueSoonAmount += remaining;
              upcoming.push({ ...inst, customer_name: custName, product_name: prodName, phone: custPhone, remaining });
            }
          }
        });
        upcoming.sort((a, b) => a.due_date.localeCompare(b.due_date));
        updateOverdueBadge(overdueCount); await updateCollectionBadge();
        el.innerHTML = lsBannerHtml() + `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">عدد العملاء</div><div class="kpi-value num">${customers.length}</div></div>
      <div class="kpi-card"><div class="kpi-label">خطط نشطة</div><div class="kpi-value num primary">${plans.length}</div></div>
      <div class="kpi-card"><div class="kpi-label">إجمالي المستحق</div><div class="kpi-value num">${fmt(totalOutstanding)}</div><div class="kpi-sub">جنيه</div></div>
      <div class="kpi-card"><div class="kpi-label">أقساط متأخرة</div><div class="kpi-value num danger">${overdueCount}</div><div class="kpi-sub">بقيمة ${fmt(overdueAmount)} ج.م</div></div>
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="kpi-card" style="background:var(--primary-tint);border-color:var(--primary);"><div class="kpi-label">💰 إجمالي المحصل</div><div class="kpi-value num primary">${fmt(totalCollected)}</div><div class="kpi-sub">جنيه</div></div>
      <div class="kpi-card" style="background:var(--amber-tint);border-color:var(--amber);"><div class="kpi-label">📅 تحصيل الشهر الحالي</div><div class="kpi-value num amber">${fmt(collectedThisMonth)}</div><div class="kpi-sub">حسب الشهر المستحق</div></div>
      <div class="kpi-card"><div class="kpi-label">⏰ مستحق خلال 7 أيام</div><div class="kpi-value num amber">${dueSoonCount}</div><div class="kpi-sub">بقيمة ${fmt(dueSoonAmount)} ج.م</div></div>
    </div>
    ${partialPayments > 0 ? `<div class="kpi-grid" style="grid-template-columns:1fr 1fr;">
      <div class="kpi-card" style="background:#FFF3E0;border-color:var(--amber);"><div class="kpi-label">🔄 دفعات جزئية</div><div class="kpi-value num amber">${partialPayments}</div><div class="kpi-sub">أقساط مدفوعة جزئياً</div></div>
      <div class="kpi-card"><div class="kpi-label">📊 سجلات تحصيل</div><div class="kpi-value num primary">${collectionMonths.length}</div><div class="kpi-sub">حسب الشهر المستحق</div></div>
    </div>`: ''}
    <div class="panel">
      <div class="panel-header"><h2>أقرب الأقساط المستحقة</h2></div>
      <div class="panel-body"><div class="row-list">
      ${upcoming.length ? upcoming.slice(0, 10).map(i => {
          const isOverdue = i.due_date < today, isPartial = (i.paid_amount || 0) > 0, remaining = i.remaining || i.amount;
          return `<div class="row-item">
          <div class="row-main">
            <div class="row-title">${esc(i.customer_name)} — ${esc(i.product_name)}</div>
            <div class="row-sub">قسط رقم ${i.seq} · استحقاق ${i.due_date}${i.phone ? ' · ' + esc(i.phone) : ''}${isPartial ? ' · دفع ' + fmt(i.paid_amount) + ' من ' + fmt(i.amount) : ''}</div>
          </div>
          <span class="pill ${isOverdue ? 'pill-danger' : (isPartial ? 'pill-partial' : 'pill-warn')}">${isOverdue ? 'متأخر' : (isPartial ? 'مدفوع جزئياً' : 'مستحق')}</span>
          <div class="row-amount num">${fmt(remaining)} ج.م</div>
          ${i.phone ? `<button class="btn btn-outline btn-sm" onclick="sendWhatsAppReminder('${esc(i.phone)}','${esc(i.customer_name)}','${esc(i.product_name)}',${remaining},'${i.due_date}')">📱</button>` : ''}
          <button class="btn btn-primary btn-sm" onclick="openPaymentModal(${i.id},'dashboard')">تسجيل الدفع</button>
        </div>`;
        }).join('') : emptyRow('مفيش أقساط مستحقة حاليًا')}
      </div></div>
    </div>`;
      } catch (err) {
        el.innerHTML = lsBannerHtml() + `<div class="empty-state"><div class="empty-icon">⚠️</div>
      <p style="color:var(--danger);font-weight:700;">تعذّر تحميل البيانات</p>
      <p>${esc(err && err.message || err)}</p>
      <p style="font-size:12.5px;max-width:340px;margin:8px auto 0;line-height:1.7;">جرّب تحديث الصفحة. لو بتفتح الملف من الموبايل مباشرة، افتحه من رابط استضافة (Netlify) عشان قاعدة البيانات تشتغل بكفاءة.</p></div>`;
      }
    }

    // ================= العملاء =================
    async function loadCustomers(q = '') {
      const el = document.getElementById('view-customers');
      el.innerHTML = `<div class="panel">
    <div class="panel-header"><h2>العملاء</h2>
      <div style="display:flex;gap:10px;width:100%;max-width:420px;">
        <input class="search-input" id="customer-search" placeholder="ابحث بالاسم أو الموبايل" value="${esc(q)}">
        <button class="btn btn-primary" id="add-customer-btn">+ عميل جديد</button>
      </div></div>
    <div class="panel-body"><div class="row-list" id="customers-list"><p style="padding:20px;color:var(--muted)">جاري التحميل...</p></div></div>
  </div>`;
      document.getElementById('add-customer-btn').addEventListener('click', () => openCustomerForm());
      const search = document.getElementById('customer-search');
      search.addEventListener('input', debounce(() => loadCustomers(search.value), 300));
      try {
        let rows = await db.getAll('customers');
        const plans = await db.getAll('plans'), installments = await db.getAll('installments'),
          collectionMonths = await db.getAll('collection_months'), today = todayStr();
        if (q) { const lower = q.toLowerCase(); rows = rows.filter(c => (c.name && c.name.toLowerCase().includes(lower)) || (c.phone && c.phone.includes(q))); }
        state.customers = rows;
        document.getElementById('customers-list').innerHTML = rows.length ? rows.map((c, idx) => {
          const custPlans = plans.filter(p => p.customer_id == c.id);
          let overdueCount = 0, balanceDue = 0, partialCount = 0;
          const totalCollected = collectionMonths.filter(col => col.customer_id === c.id).reduce((s, col) => s + col.amount, 0);
          custPlans.forEach(p => installments.filter(i => i.plan_id == p.id).forEach(i => {
            if (!i.paid) {
              const rem = i.amount - (i.paid_amount || 0); balanceDue += rem;
              if (i.due_date < today) overdueCount++; if ((i.paid_amount || 0) > 0) partialCount++;
            }
          }));
          return `<div class="row-item" style="cursor:pointer;animation-delay:${Math.min(idx * 25, 300)}ms" onclick="showCustomerProfile(${c.id})">
        <div class="row-main">
          <div class="row-title">${esc(c.name)}</div>
          <div class="row-sub">${esc(c.phone || 'بدون رقم')} · ${custPlans.length} خطة${partialCount > 0 ? ' · 🟡 ' + partialCount + ' دفعة جزئية' : ''}${totalCollected > 0 ? ' · 💰 محصل ' + fmt(totalCollected) : ''}</div>
        </div>
        ${overdueCount > 0 ? `<span class="pill pill-danger">${overdueCount} متأخر</span>` : partialCount > 0 ? '<span class="pill pill-partial">دفع جزئي</span>' : '<span class="pill pill-ok">منتظم</span>'}
        <div class="row-amount num">${fmt(balanceDue)} ج.م</div>

        }).join('') : emptyRow('مفيش عملاء لسه، ابدأ بإضافة عميل جديد');
      } catch (err) { document.getElementById('customers-list').innerHTML = '<p style="color:var(--danger);padding:20px;">' + (err.message || err) + '</p>'; }

    // ★★★ ملف العميل ★★★
    function showCustomerProfile(id) { state.currentCustomerId = id; switchView('customer-profile'); }
    async function renderCustomerProfile(id) {
      const el = document.getElementById('view-customer-profile');
      el.innerHTML = '<p style="color:var(--muted)">جاري التحميل...</p>';
      try {
        const c = await db.getById('customers', id);
        if (!c) { el.innerHTML = emptyRow('العميل غير موجود'); return; }
        const allPlans = await db.getAll('plans'), custPlans = allPlans.filter(p => p.customer_id == id);
        const allInsts = await db.getAll('installments');
        const custInsts = allInsts.filter(i => custPlans.some(p => p.id == i.plan_id));
        const allCols = await db.getAll('collection_months');
        const today = todayStr();
        let totalPaid = 0, totalRemaining = 0, overdueTotal = 0, overdueCount = 0, partialCount = 0;
        custInsts.forEach(i => {
          const paidAmt = i.paid_amount || 0;
          if (i.paid) { totalPaid += paidAmt || i.amount; }
          else {
            const rem = i.amount - paidAmt; totalRemaining += rem;
            if (i.due_date < today) { overdueTotal += rem; overdueCount++; }
            if (paidAmt > 0) partialCount++;
          }

    async function processPartialPayment(instId, paidAmount, note, fromView, planId) {
      try {
        const inst = await db.getById('installments', instId), plan = await db.getById('plans', inst.plan_id),
          cust = await db.getById('customers', plan.customer_id);
        const alreadyPaid = inst.paid_amount || 0;
        let remainingAfter = round2(inst.amount - (alreadyPaid + paidAmount)); if (remainingAfter < 0) remainingAfter = 0;
        inst.payment_history = inst.payment_history || [];
        inst.payment_history.push({ date: todayStr(), amount: paidAmount, note: note || 'دفع', remaining_after: remainingAfter });
        inst.paid_amount = round2(alreadyPaid + paidAmount); inst.last_payment_date = todayStr();
        await recordCollectionMonth(plan.customer_id, instId, paidAmount, inst.due_date || todayStr(), plan.id);
        let deferredTo = null;
        if (remainingAfter > 0) {
          const allInsts = await db.getAll('installments');
          const nextInst = allInsts.filter(i => i.plan_id === inst.plan_id && i.seq > inst.seq && !i.paid).sort((a, b) => a.seq - b.seq)[0];
          if (nextInst) {
            nextInst.amount = round2(nextInst.amount + remainingAfter);
            nextInst.has_deferred = true; nextInst.deferred_from = inst.seq; nextInst.deferred_amount = remainingAfter;
            await db.update('installments', nextInst); deferredTo = nextInst;
            inst.paid = true; inst.paid_date = todayStr(); inst.remaining_balance = 0;
          } else { inst.paid = false; inst.remaining_balance = remainingAfter; inst.has_outstanding_balance = true; }
        } else { inst.paid = true; inst.paid_date = todayStr(); inst.remaining_balance = 0; inst.has_outstanding_balance = false; }
        await db.update('installments', inst);
        if (deferredTo) {
          showToast('✅ تم دفع ' + fmt(paidAmount) + ' ج.م، وترحيل ' + fmt(remainingAfter) + ' ج.م للقسط ' + deferredTo.seq);
          showInAppNotification('🔄 ' + (cust ? cust.name : 'عميل') + '\nتم دفع ' + fmt(paidAmount) + ' ج.م\nتم ترحيل ' + fmt(remainingAfter) + ' ج.م للقسط ' + deferredTo.seq, 'warning', 8000);
        } else if (remainingAfter > 0) {
          showToast('⚠️ تم دفع ' + fmt(paidAmount) + ' ج.م، باقي ' + fmt(remainingAfter) + ' ج.م رصيد معلق');
          showInAppNotification('⚠️ ' + (cust ? cust.name : 'عميل') + '\nمتبقي ' + fmt(remainingAfter) + ' ج.م كرصيد معلق', 'warning', 8000);
        } else {
          showToast('✅ تم تسجيل الدفع كاملاً (' + fmt(paidAmount) + ' ج.م)');
          showInAppNotification('✅ ' + (cust ? cust.name : 'عميل') + '\nتم دفع ' + fmt(paidAmount) + ' ج.م بالكامل\n' + (plan ? plan.product_name : ''), 'success');
        }
        await updateCollectionBadge(); closeModal();
        if (fromView === 'plans') loadPlans();
        else if (fromView === 'overdue') loadOverdue();
        else if (fromView === 'plan-detail') openPlanDetail(planId || inst.plan_id);
        else if (fromView === 'customer-profile') renderCustomerProfile(state.currentCustomerId);
        else loadDashboard();
      } catch (err) { showToast('❌ خطأ أثناء تسجيل الدفع: ' + err.message); }
    }
    async function revertInstallment(instId) {
      try {
        const inst = await db.getById('installments', instId);
        const allCols = await db.getAll('collection_months');
        for (const col of allCols.filter(c => c.installment_id === instId)) await db.delete('collection_months', col.id);
        const allInsts = await db.getAll('installments');
        const child = allInsts.find(i => i.plan_id === inst.plan_id && i.deferred_from === inst.seq);
        if (child && (child.deferred_amount || 0) > 0) {
          if (child.paid) showToast('⚠️ القسط المرحَّل إليه مدفوع بالفعل — راجع يدوياً');
          else {
            child.amount = round2(child.amount - child.deferred_amount);
            child.has_deferred = false; child.deferred_from = null; child.deferred_amount = 0;
            await db.update('installments', child);
          }
        }
        inst.paid = false; inst.paid_date = null; inst.paid_amount = 0; inst.remaining_balance = inst.amount;
        inst.payment_history = [];
        await db.update('installments', inst);
        await updateCollectionBadge(); showToast('تم التراجع عن الدفع');
        if (state.view === 'dashboard') loadDashboard();
      } catch (err) { showToast(err.message || err); }

    function normalizePhoneForWhatsapp(phone) {
      if (!phone) return ''; let p = phone.replace(/[^0-9+]/g, '');
      if (p.startsWith('+')) return p.slice(1);
      if (p.startsWith('00')) return p.slice(2);
      if (p.startsWith('0')) return '2' + p;
      return p;
    }
    function sendWhatsAppReminder(phone, customerName, productName, amount, dueDate) {

      const waPhone = normalizePhoneForWhatsapp(phone);

    const getControlNumber = () => localStorage.getItem('mido_control_number') || '';
    const setControlNumber = p => localStorage.setItem('mido_control_number', p);
    async function buildDetailedReport() {
      const installments = await db.getAll('installments'), plans = await db.getAll('plans'),
        customers = await db.getAll('customers'), collectionMonths = await db.getAll('collection_months'), today = todayStr();
      let totalPaid = 0, totalPending = 0, totalOverdue = 0;
      const overdueList = [], dueTodayList = [], dueSoonList = [], partialList = [], monthTotals = {};
      collectionMonths.forEach(col => { monthTotals[col.month] = (monthTotals[col.month] || 0) + col.amount; });
      const three = new Date(); three.setDate(three.getDate() + 3); const threeStr = toLocalISO(three);
      for (const inst of installments) {
        const remaining = inst.amount - (inst.paid_amount || 0);
        const plan = plans.find(p => p.id === inst.plan_id), cust = customers.find(c => c.id === (plan ? plan.customer_id : null));
        const info = {
          customer: cust ? cust.name : 'غير معروف', product: plan ? plan.product_name : '', amount: remaining,
          due_date: inst.due_date, phone: cust ? cust.phone : '', seq: inst.seq
        };
        if (inst.paid) { totalPaid += inst.paid_amount || inst.amount; continue; }
        totalPending += remaining;
        if (inst.due_date < today) { totalOverdue += remaining; overdueList.push(info); }
        else if (inst.due_date === today) dueTodayList.push(info);
        else if (inst.due_date <= threeStr) dueSoonList.push(info);
        if ((inst.remaining_balance || 0) > 0) partialList.push({ ...info, amount: inst.remaining_balance });
      }
      let report = 'تقرير Mido اليومي\n' + today + '\n' + '='.repeat(40) + '\n📊 الملخص العام\n' + '-'.repeat(30) + '\n' +
        'العملاء: ' + customers.length + '\nالخطط: ' + plans.length + '\nالمحصل: ' + fmt(totalPaid) + ' ج.م\nالمستحق: ' + fmt(totalPending) + ' ج.م\n';
      if (Object.keys(monthTotals).length) {
        report += '\n📊 تحصيل الشهور\n' + '-'.repeat(30) + '\n';
        Object.keys(monthTotals).sort().forEach(m => report += m + ': ' + fmt(monthTotals[m]) + ' ج.م\n');
      }
      function section(title, list, total, cap) {
        if (!list.length) return '';
        let s = '\n' + title + ' (' + list.length + ')\n' + '-'.repeat(30) + '\n' + (total != null ? 'الإجمالي: ' + fmt(total) + ' ج.م\n' : '');
        list.slice(0, cap).forEach(i => { s += '• ' + i.customer + '\n  المنتج: ' + i.product + '\n  المبلغ: ' + fmt(i.amount) + ' ج.م\n  الاستحقاق: ' + i.due_date + '\n' + (i.phone ? '  الموبايل: ' + i.phone + '\n' : '') + '\n'; });
        if (list.length > cap) s += '... و ' + (list.length - cap) + ' أخرى\n'; return s;
      }
      report += section('🚨 المتأخرات', overdueList.sort((a, b) => a.due_date.localeCompare(b.due_date)), totalOverdue, 20);
      report += section('📌 مستحق اليوم', dueTodayList, dueTodayList.reduce((s, i) => s + i.amount, 0), 20);
      report += section('⏰ مستحق خلال 3 أيام', dueSoonList, dueSoonList.reduce((s, i) => s + i.amount, 0), 15);
      report += section('🟡 رصيد معلق', partialList, partialList.reduce((s, i) => s + i.amount, 0), 10);
      if (!overdueList.length && !dueTodayList.length && !dueSoonList.length && !partialList.length) report += '\n✅ مفيش أقساط مستحقة أو متأخرة\n';
      report += '\n' + '='.repeat(40) + '\nMido App';
      return report;
    }

      const controlPhone = getControlNumber();

      try {
        showToast('⏳ جاري إعداد التقرير...');

    function openControlNumberSettings() {
      openModal(`<h2>📱 رقم التحكم (لتقرير اليوم)</h2>
  <p style="color:var(--muted);font-size:13px;margin-bottom:14px;">الرقم ده هيُستخدم لما تدوس "إرسال تقرير اليوم" — هيبعتلك تقرير مفصل على واتساب.</p>
