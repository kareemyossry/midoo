  <button class="btn btn-primary" id="save-control-number-btn">حفظ</button></div>`);
      document.getElementById('save-control-number-btn').addEventListener('click', () => {
        const val = document.getElementById('control-number-input').value.trim();
        if (!val) { showToast('❌ اكتب رقم صحيح'); return; }
        setControlNumber(val); closeModal(); showToast('✅ تم حفظ رقم التحكم');
      });
    }

    // ================= الجمعيات =================
    let circleMemberRows = 0;
    async function loadCircles() {
      const el = document.getElementById('view-circles');
      el.innerHTML = `<div class="panel"><div class="panel-header"><h2>الجمعيات</h2>
    <button class="btn btn-primary" onclick="openCircleForm()">+ جمعية جديدة</button></div>
    <div class="panel-body"><div class="row-list" id="circles-list"><p style="padding:20px;color:var(--muted)">جاري التحميل...</p></div></div></div>`;
      try {
        const circles = await db.getAll('circles'), members = await db.getAll('circle_members'),
          payments = await db.getAll('circle_payments'), payouts = await db.getAll('circle_payouts');
        document.getElementById('circles-list').innerHTML = circles.length ? circles.map((c, idx) => {
          const cMembers = members.filter(m => m.circle_id == c.id),
            unpaidCount = payments.filter(p => p.circle_id == c.id && !p.paid).length,
            pendingPayouts = payouts.filter(p => p.circle_id == c.id && !p.paid_out).length;
          return `<div class="row-item" style="cursor:pointer;animation-delay:${Math.min(idx * 25, 300)}ms" onclick="openCircleDetail(${c.id})">
        <div class="row-main"><div class="row-title">${esc(c.name)}</div>
        <div class="row-sub">${cMembers.length} أعضاء · قسط شهري ${fmt(c.monthly_amount)} ج.م · بدأت ${c.start_date}</div></div>
        ${unpaidCount > 0 ? `<span class="pill pill-warn">${unpaidCount} دفعة معلقة</span>` : '<span class="pill pill-ok">منتظمة</span>'}
        ${pendingPayouts > 0 ? `<span class="pill pill-muted">${pendingPayouts} دور لسه ما اتسلمش</span>` : ''}
      </div>`;
        }).join('') : emptyRow('مفيش جمعيات لسه، ابدأ بإنشاء جمعية جديدة');
      } catch (err) { document.getElementById('circles-list').innerHTML = '<p style="color:var(--danger);padding:20px;">' + (err.message || err) + '</p>'; }
    }
    function circleMemberRowHtml(idx) {
      return '<div class="form-row" style="align-items:end;">' +
        '<div class="form-group"><label>اسم العضو ' + (idx + 1) + '</label><input type="text" class="member-name" placeholder="اسم العضو"></div>' +
        '<div class="form-group"><label>موبايله</label><input type="text" class="member-phone" placeholder="رقم الموبايل"></div></div>';
    }
    function addMemberRow() { circleMemberRows++; document.getElementById('members-container').insertAdjacentHTML('beforeend', circleMemberRowHtml(circleMemberRows - 1)); }
    function openCircleForm() {
      circleMemberRows = 0;
      openModal(`<h2>جمعية جديدة</h2><div id="form-error"></div>
  <div class="form-group"><label>اسم الجمعية *</label><input id="g-name" type="text" placeholder="مثال: جمعية شهر يناير"></div>
  <div class="form-row">
    <div class="form-group"><label>المبلغ الشهري لكل عضو *</label><input id="g-amount" type="number" min="0"></div>
    <div class="form-group"><label>دورية الدفع (أيام)</label><input id="g-freq" type="number" min="1" value="30"></div>
  </div>
  <div class="form-group"><label>تاريخ البداية *</label><input id="g-start" type="date" value="${todayStr()}"></div>
  <p class="form-hint" style="margin-bottom:10px;">رتب الأعضاء بترتيب استلام الدور.</p>
  <div id="members-container"></div>
  <button class="btn btn-outline btn-sm" type="button" onclick="addMemberRow()" style="margin-bottom:14px;">+ إضافة عضو</button>
  <div class="modal-close-row"><button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
  <button class="btn btn-primary" id="save-circle-btn">إنشاء الجمعية</button></div>`);
      addMemberRow(); addMemberRow();
      document.getElementById('save-circle-btn').addEventListener('click', async () => {
        const errBox = document.getElementById('form-error');
        const name = document.getElementById('g-name').value.trim(), monthly_amount = Number(document.getElementById('g-amount').value),
          frequency_days = parseInt(document.getElementById('g-freq').value, 10) || 30, start_date = document.getElementById('g-start').value;
        const names = [...document.querySelectorAll('.member-name')], phones = [...document.querySelectorAll('.member-phone')];
        const membersInputs = names.map((input, i) => ({ name: input.value.trim(), phone: phones[i].value.trim() })).filter(m => m.name);
        if (!name || !monthly_amount || !start_date || membersInputs.length < 2) {
          errBox.innerHTML = '<div class="form-error">أكمل اسم الجمعية والمبلغ والتاريخ، وأضف عضوين على الأقل</div>'; return;
        }
        try {
          const circleId = await db.add('circles', { name, monthly_amount, frequency_days, start_date });
          const memberIds = [];
          for (let i = 0; i < membersInputs.length; i++) {
            const mId = await db.add('circle_members', {
              circle_id: circleId, customer_name: membersInputs[i].name,
              phone: membersInputs[i].phone, turn_order: i + 1
            });
            memberIds.push({ id: mId, name: membersInputs[i].name, turn: i + 1 });
          }
          const potAmount = monthly_amount * membersInputs.length;
          let currDate = new Date(start_date + 'T12:00:00');
          for (let round = 1; round <= membersInputs.length; round++) {
            const dueDateStr = toLocalISO(currDate), recipient = memberIds.find(m => m.turn === round);
            await db.add('circle_payouts', {
              circle_id: circleId, member_id: recipient ? recipient.id : null,
              customer_name: recipient ? recipient.name : '', turn_order: round, amount: potAmount, due_date: dueDateStr, paid_out: false
            });
            for (const m of memberIds) await db.add('circle_payments', { circle_id: circleId, member_id: m.id, round_number: round, due_date: dueDateStr, paid: false });
            currDate.setDate(currDate.getDate() + frequency_days);
          }
          closeModal(); showToast('تم إنشاء الجمعية بنجاح'); loadCircles();
        } catch (err) { errBox.innerHTML = '<div class="form-error">' + (err.message || err) + '</div>'; }
      });
    }
    async function openCircleDetail(id) {
      const c = await db.getById('circles', id), allMembers = await db.getAll('circle_members'),
        cMembers = allMembers.filter(m => m.circle_id == id).sort((a, b) => a.turn_order - b.turn_order),
        allPayments = await db.getAll('circle_payments'), cPayments = allPayments.filter(p => p.circle_id == id),
        allPayouts = await db.getAll('circle_payouts'), cPayouts = allPayouts.filter(p => p.circle_id == id).sort((a, b) => a.turn_order - b.turn_order),
        today = todayStr();
      const memberCols = cMembers.map(m => '<th><span class="turn-badge">' + m.turn_order + '</span><br>' + esc(m.customer_name) + '</th>').join('');
      const rounds = [...new Set(cPayments.map(p => p.round_number))].sort((a, b) => a - b);
      const paymentRows = rounds.map(round => {
        const cells = cMembers.map(m => {
          const pay = cPayments.find(p => p.member_id == m.id && p.round_number == round);
          if (!pay) return '<td></td>';
          const isOverdue = !pay.paid && pay.due_date < today, cls = pay.paid ? 'paid' : (isOverdue ? 'overdue-cell' : '');
          return '<td><button class="pay-dot ' + cls + '" onclick="toggleCirclePayment(' + pay.id + ',' + pay.paid + ',' + id + ')" title="' + pay.due_date + '">' + (pay.paid ? '✓' : '·') + '</button></td>';
        }).join('');
        const dueDate = (cPayments.find(p => p.round_number == round) || {}).due_date || '';
        return '<tr><td class="member-name">دور ' + round + ' (' + dueDate + ')</td>' + cells + '</tr>';
      }).join('');
      const payoutsHtml = cPayouts.map(po => `
    <div class="payout-row"><span class="turn-badge">${po.turn_order}</span>
      <div class="row-main"><div class="row-title">${esc(po.customer_name)}</div>
      <div class="row-sub">استحقاق الدور: ${po.due_date} · قيمة الدور ${fmt(po.amount)} ج.م</div></div>
      <span class="pill ${po.paid_out ? 'pill-ok' : (po.due_date < today ? 'pill-warn' : 'pill-muted')}">${po.paid_out ? 'اتسلم' : (po.due_date < today ? 'مستحق التسليم' : 'لسه')}</span>
      <button class="btn ${po.paid_out ? 'btn-outline' : 'btn-primary'} btn-sm" onclick="toggleCirclePayout(${po.id},${po.paid_out},${id})">${po.paid_out ? 'تراجع' : 'تسليم الدور'}</button>
    </div>`).join('');
      openModal(`<h2>${esc(c.name)}</h2>
  <p style="color:var(--muted);font-size:13px;margin-bottom:16px;">${cMembers.length} أعضاء · قسط شهري ${fmt(c.monthly_amount)} ج.م · بدأت ${c.start_date}</p>
  <h3 style="font-size:14px;margin-bottom:10px;">جدول تحصيل الدفعات</h3>
  <div style="overflow-x:auto;margin-bottom:20px;"><table class="round-table">
    <thead><tr><th></th>${memberCols}</tr></thead><tbody>${paymentRows}</tbody></table></div>
  <h3 style="font-size:14px;margin-bottom:10px;">جدول استلام الدور</h3>
  <div style="border:1px solid var(--border);border-radius:9px;padding:0 14px;max-height:220px;overflow-y:auto;">${payoutsHtml}</div>
  <div class="modal-close-row"><button class="btn btn-danger-text" onclick="deleteCircle(${id})">حذف الجمعية</button>
  <button class="btn btn-outline" onclick="closeModal()">إغلاق</button></div>`);
    }
    async function toggleCirclePayment(id, currentlyPaid, circleId) {
      try {
        const pay = await db.getById('circle_payments', id); pay.paid = !currentlyPaid;
        await db.update('circle_payments', pay); openCircleDetail(circleId);
      } catch (err) { showToast(err.message || err); }
    }
    async function toggleCirclePayout(id, currentlyPaidOut, circleId) {
      try {
        const po = await db.getById('circle_payouts', id); po.paid_out = !currentlyPaidOut;
        await db.update('circle_payouts', po); openCircleDetail(circleId);
      } catch (err) { showToast(err.message || err); }
    }
    async function deleteCircle(id) {
      if (!confirm('متأكد إنك عايز تحذف الجمعية دي؟')) return;
      try {
        await db.delete('circles', id);
        for (const s of ['circle_members', 'circle_payments', 'circle_payouts']) {
          const all = await db.getAll(s); for (const item of all.filter(x => x.circle_id == id)) await db.delete(s, item.id);
        }
        closeModal(); showToast('تم حذف الجمعية'); loadCircles();
      } catch (err) { showToast(err.message || err); }
    }

    // ================= النسخ الاحتياطي =================
    function hasCapacitorFS() { return !!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem); }
    function openFileDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('MidoFileStore', 1);
        req.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'name' }); };
        req.onsuccess = () => resolve(req.result); req.onerror = () => {
          // لو حتى قاعدة الملفات مش شغالة، نرجع كائن وهمي بيستخدم localStorage
          resolve(null);
        };
      });
    }
    async function saveFileToApp(fileName, data) {
      try {
        // نحفظ دايماً في localStorage كاحتياطي مضمون
        try {
          const idx = JSON.parse(localStorage.getItem('mido_file_index') || '[]');
          if (!idx.find(f => f.name === fileName)) idx.push({ name: fileName, date: todayStr(), size: data.length });
          localStorage.setItem('mido_file_index', JSON.stringify(idx));
          localStorage.setItem('mido_file_' + fileName, data);
        } catch (e) { console.warn('تعذر حفظ الملف في localStorage', e); }
        const d = await openFileDB();
        if (d) {
          const tx = d.transaction('files', 'readwrite');
          tx.objectStore('files').put({ name: fileName, data, date: todayStr(), size: data.length });
          await new Promise(res => tx.oncomplete = res);
        }
        return true;
      } catch (err) { console.log('فشل حفظ الملف:', err); return false; }
    }
    async function getFileFromApp(fileName) {
      try {
        const d = await openFileDB();
        if (d) {
          const r = await new Promise(res => { const q = d.transaction('files', 'readonly').objectStore('files').get(fileName); q.onsuccess = () => res(q.result); q.onerror = () => res(null); });
          if (r) return r;
        }
        const ls = localStorage.getItem('mido_file_' + fileName);
        if (ls) return { name: fileName, data: ls };
        return null;
      } catch (err) { return null; }
    }
    async function listSavedFiles() {
      const out = [];
      try { const idx = JSON.parse(localStorage.getItem('mido_file_index') || '[]'); idx.forEach(f => out.push(f)); } catch (e) { }
      try {
        const d = await openFileDB(); if (d) {
          const files = await new Promise(res => { const r = d.transaction('files', 'readonly').objectStore('files').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); });
          files.forEach(f => { if (!out.find(o => o.name === f.name)) out.push({ name: f.name, date: f.date, size: f.size }); });
        }
      } catch (e) { }
      return out;
    }
    async function collectBackupData() {
      return {
        customers: await db.getAll('customers'), plans: await db.getAll('plans'), installments: await db.getAll('installments'),
        circles: await db.getAll('circles'), circle_members: await db.getAll('circle_members'),
        circle_payments: await db.getAll('circle_payments'), circle_payouts: await db.getAll('circle_payouts'),
        collection_months: await db.getAll('collection_months'), exported_at: new Date().toISOString()
      };
    }
    async function doBackupExportAndShare() {
      const data = await collectBackupData(), jsonStr = JSON.stringify(data, null, 2), fileName = 'Mido_Backup_' + todayStr() + '.mido';
      await saveFileToApp(fileName, jsonStr);
      if (hasCapacitorFS()) {
        try {
          const { Filesystem, Directory } = window.Capacitor.Plugins;
          const write = await Filesystem.writeFile({ path: fileName, data: jsonStr, directory: Directory.Cache, encoding: 'utf8' });
          if (window.Capacitor.Plugins.Share) {
            await window.Capacitor.Plugins.Share.share({ title: 'نسخة احتياطية من Mido', text: 'ملف النسخة الاحتياطية - ' + todayStr(), url: write.uri });
            showToast('✅ اختار مكان الحفظ');
          } else showToast('✅ تم حفظ الملف: ' + fileName);
          return;
        } catch (err) { console.log('Capacitor فشل:', err); }
      }
      const file = new File([jsonStr], fileName, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'نسخة احتياطية من Mido', text: 'ملف النسخة الاحتياطية - ' + todayStr() });
          showToast('✅ تم مشاركة النسخة الاحتياطية'); return;
        }
        catch (err) { if (err.name === 'AbortError') { showToast('❌ تم إلغاء المشاركة'); return; } }
      }
      const blob = new Blob([jsonStr], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = fileName; a.style.display = 'none'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500); showToast('✅ تم تنزيل النسخة الاحتياطية');
    }
    document.getElementById('backup-btn').addEventListener('click', async () => { showToast('⏳ جاري التجهيز...'); try { await doBackupExportAndShare(); } catch (err) { showToast('❌ ' + (err.message || err)); } closeDrawer(); });
    document.getElementById('share-backup-btn').addEventListener('click', async () => { showToast('⏳ جاري التجهيز...'); try { await doBackupExportAndShare(); } catch (err) { showToast('❌ ' + (err.message || err)); } closeDrawer(); });
    async function showSavedFiles() {
      try {
        const files = await listSavedFiles();
        if (!files.length) { showToast('📂 مفيش ملفات نسخ احتياطي'); return; }
        let html = '<h2>📂 الملفات المحفوظة</h2><p style="color:var(--muted);font-size:13px;margin-bottom:12px;">اختر ملف لاسترجاع البيانات منه:</p><div style="max-height:350px;overflow-y:auto;">';
        files.forEach(f => {
          html += '<div class="row-item"><div class="row-main"><div class="row-title">📊 ' + esc(f.name) + '</div>' +
            '<div class="row-sub">التاريخ: ' + (f.date || 'غير معروف') + ' · الحجم: ' + ((f.size || 0) / 1024).toFixed(1) + ' KB</div></div>' +
            '<button class="btn btn-primary btn-sm" onclick="restoreFromApp(\'' + esc(f.name) + '\')">🔄 استرجاع</button>' +
            '<button class="btn btn-danger-text btn-sm" onclick="deleteSavedFile(\'' + esc(f.name) + '\')">🗑️</button></div>';
        });
        html += '</div><div class="modal-close-row"><button class="btn btn-outline" onclick="closeModal()">إغلاق</button></div>';
        openModal(html);
      } catch (err) { showToast('❌ ' + err.message); }
    }
    async function restoreData(data) {
      if (!data.customers || !data.plans) throw new Error('الملف غير صالح');
      await db.clearAll();
      for (const c of data.customers || []) await db.add('customers', c);
      for (const p of data.plans || []) await db.add('plans', p);
      for (const i of data.installments || []) await db.add('installments', i);
      for (const cr of data.circles || []) await db.add('circles', cr);
      for (const cm of data.circle_members || []) await db.add('circle_members', cm);
      for (const cp of data.circle_payments || []) await db.add('circle_payments', cp);
      for (const cpo of data.circle_payouts || []) await db.add('circle_payouts', cpo);
      for (const col of data.collection_months || []) await db.add('collection_months', col);
    }
    async function restoreFromApp(fileName) {
      if (!confirm('⚠️ استرجاع البيانات من "' + fileName + '"؟ سيتم استبدال البيانات الحالية.')) return;
      try {
        showToast('⏳ جاري الاسترجاع...');
        const file = await getFileFromApp(fileName);
        if (!file) { showToast('❌ الملف غير موجود'); return; }
        await restoreData(JSON.parse(file.data));
        showToast('✅ تم استرجاع البيانات بنجاح!'); closeModal(); switchView(state.view); await updateCollectionBadge();
      } catch (err) { showToast('❌ ' + err.message); }
    }
    async function deleteSavedFile(fileName) {
      if (!confirm('⚠️ حذف الملف "' + fileName + '"؟')) return;
      try {
        try {
          localStorage.removeItem('mido_file_' + fileName);
          const idx = JSON.parse(localStorage.getItem('mido_file_index') || '[]').filter(f => f.name !== fileName);
          localStorage.setItem('mido_file_index', JSON.stringify(idx));
        } catch (e) { }
        const d = await openFileDB();
        if (d) { const tx = d.transaction('files', 'readwrite'); tx.objectStore('files').delete(fileName); await new Promise(res => tx.oncomplete = res); }
        showToast('✅ تم حذف الملف'); showSavedFiles();
      } catch (err) { showToast('❌ ' + err.message); }
    }
    document.getElementById('restore-btn').addEventListener('click', () => { document.getElementById('import-file').click(); closeDrawer(); });
    document.getElementById('import-file').addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async evt => {
        try {
          if (!confirm('⚠️ استرجاع البيانات سيمحو البيانات الحالية. هل أنت متأكد؟')) return;
          showToast('⏳ جاري الاسترجاع...');
          await restoreData(JSON.parse(evt.target.result));
          showToast('✅ تم استرجاع البيانات بنجاح!'); switchView(state.view); await updateCollectionBadge();
        } catch (err) { alert('❌ فشل استرجاع الملف: ' + err.message); }
      };
      reader.readAsText(file); e.target.value = '';
    });
    document.getElementById('saved-files-btn').addEventListener('click', () => { showSavedFiles(); closeDrawer(); });
    document.getElementById('control-number-btn').addEventListener('click', () => { openControlNumberSettings(); closeDrawer(); });
    document.getElementById('daily-summary-btn').addEventListener('click', () => { sendDailySummaryToControlNumber(); closeDrawer(); });

    // ================= البدء =================
    document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    checkActivation();
    if (sessionStorage.getItem('mido_admin_logged') === 'true') {
      loadDashboard(); setTimeout(checkDueInstallments, 3000); setTimeout(updateCollectionBadge, 1000);
    }
  </script>
